stages: 
  - build
  - deploy

build_job: 
  stage: build
  image: node:22
  script: 
  - npm ci
  - npm run build -- --mode production 

  artifacts: 
    paths:
    - dist/
  
  only:
   - main

deploy_job:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H tu-servidor.dreamhost.com >> ~/.ssh/known_hosts
  script: 
    - rsync -avz --delete dist/ usuario@tu-servidor.dreamhost.com:/ruta/public_html/
  only: 
    - main