stages: 
  - build
  - deploy

build_job: 
  stage: build
  image: node:22
  script: 
    - npm ci
    - npm run build -- --mode production 
  artifacts: 
    paths:
      - dist/
  only:
    - main

deploy_job:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache lftp
  tags:
   - deploy-runner-demo
  script:
    - lftp -c "
      open -u $FTP_USER,$FTP_PASSWORD sftp://tu-servidor.dreamhost.com;
      mirror -R --delete --verbose dist /home/ikamx/ika.mx/;
      "
  only: 
    - main
